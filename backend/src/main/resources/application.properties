# =========================================================
# AI Smart Grading System - Backend Configuration
# =========================================================

# Application
spring.application.name=smart-grading-backend

# =========================================================
# Server Configuration
# =========================================================

server.port=8080

# =========================================================
# MySQL Database Configuration
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_grading_db}
spring.datasource.username=root
spring.datasource.password=saikumar1234_
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / Hibernate Configuration
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# Database Initialization
# =========================================================

spring.sql.init.mode=never

# =========================================================
# Logging
# =========================================================

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE