# =========================================================
# AI Smart Grading System - Backend Configuration
# =========================================================

# Application
spring.application.name=smart-grading-backend

# =========================================================
# Server Configuration
# =========================================================

server.port=8080

# =========================================================
# MySQL Database Configuration
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/ai_smart_grading
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / Hibernate Configuration
# =========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# Database Initialization
# =========================================================

spring.sql.init.mode=never

# =========================================================
# Logging
# =========================================================

logging.level.org.springframework.web=INFO
server.error.include-stacktrace=never
server.error.include-message=never
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-secure-32-character-minimum-value}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.ai.service-url=${AI_SERVICE_URL:http://localhost:8501}
app.ai.connect-timeout=${AI_CONNECT_TIMEOUT:3s}
app.ai.read-timeout=${AI_READ_TIMEOUT:180s}
