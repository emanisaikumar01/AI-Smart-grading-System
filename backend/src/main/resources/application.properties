spring.application.name=smart-grading-backend

# Server Configuration
server.port=8080

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_grading}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}


# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=mysql
spring.jpa.generate-ddl=true

# Logging
logging.level.root=INFO
logging.level.com.smartgrading.backend=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-secure-32-character-minimum-value}
jwt.expiration=${JWT_EXPIRATION:86400000}

